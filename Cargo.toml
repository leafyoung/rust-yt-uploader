[package]
name = "rust-yt-uploader"
version = "0.2.8"
edition = "2024"
authors = ["Your Name <your.email@example.com>"]
description = "High-performance YouTube video uploader in Rust with OAuth 2.0, concurrent uploads, and comprehensive validation"
license = "MIT"
repository = "https://github.com/example-org/rust-yt-uploader"
keywords = ["youtube", "upload", "oauth", "async", "google"]
categories = [
    "api-bindings",
    "multimedia::video",
    "authentication",
    "web-programming::http-client",
]
exclude = [
    "client_secret.json",
    "youtube-oauth2.json",
    "example-batch-config.yaml",
    "example-individual-config.yaml",
]

[lib]
name = "rust_yt_uploader"

[[bin]]
name = "yt-upload"
path = "src/bin/yt_upload.rs"

[[bin]]
name = "yt-list"
path = "src/bin/yt_list.rs"

[[bin]]
name = "yt-update-lang"
path = "src/bin/yt_update_lang.rs"

[features]
default = []
# default = ["use-yup-oauth2"]
use-yup-oauth2 = ["yup-oauth2"]

[dependencies]
# Async runtime
tokio = { version = "1.49.0", features = ["full"] }

# HTTP client and Google Cloud SDK
reqwest = { version = "0.13.1", features = [
    "json",
    "multipart",
    "stream",
    "form",
] }
yup-oauth2 = { version = "12.1.2", optional = true }

# CLI
clap = { version = "4.5.54", features = ["derive"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml_ng = "0.10.0"
serde_json = "1.0.149"

# Error handling
anyhow = "1.0.100"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }

# Validation
validator = { version = "0.20.0", features = ["derive"] }
regex = "1.12.2"

# Utilities
rand = "0.9.2"
futures = "0.3.31"
url = "2.5.8"
shellexpand = "3.1.1"
sha2 = "0.10.9"
base64 = "0.22.1"
urlencoding = "2.1.3"
open = "5.3.3"
tiny_http = "0.12.0"

# File handling
mime = "0.3.17"
mime_guess = "2.0.5"
serde-jsonlines = "0.7.0"
tokio-util = { version = "0.7.18", features = ["io"] }

# Progress bars
indicatif = "0.18.3"

[dev-dependencies]
tempfile = "3.24.0"
